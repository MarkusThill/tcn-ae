name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: pyrefly (blocking)
        run: uv run pyrefly check
      - name: ty (experimental, advisory only)
        continue-on-error: true
        run: uv run ty check
      - name: zizmor (workflow security)
        run: uv run zizmor .github/workflows

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync
      # Coverage is gated by `fail_under` in [tool.coverage.report].
      - run: uv run pytest --cov --cov-report=term-missing

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - id: check
        run: |
          shopt -s nullglob
          files=(notebooks/*.ipynb)
          echo "found=${#files[@]}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.found != '0'
        run: uv run pytest --nbmake notebooks/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group docs
      - run: uv run zensical build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*

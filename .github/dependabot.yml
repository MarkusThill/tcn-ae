version: 2
updates:
  # prek hook revisions are handled separately by `uv run prek auto-update`.
  # `cooldown` delays PRs for freshly published versions, which blunts the impact
  # of a compromised release being pulled in immediately.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
